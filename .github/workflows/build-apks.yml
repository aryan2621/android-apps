name: Build APKs

# Every push to main builds each app and publishes the APKs as a GitHub release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: "Cool Launcher", dir: "Cool Launcher", slug: cool-launcher }
          - { name: "Instashow", dir: "Instashow", slug: instashow }
          - { name: "Pause", dir: "Pause", slug: pause }
          - { name: "Tasker", dir: "Tasker", slug: tasker, firebase: true }
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # One fixed debug key for every build, so a new APK installs over the previous one.
      - name: Use shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; this build uses a one-off debug key."
          fi

      # Firebase apps need google-services.json, which stays out of the repo.
      - name: Add google-services.json
        id: firebase
        if: matrix.app.firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.TASKER_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::TASKER_GOOGLE_SERVICES_JSON is not set; skipping ${{ matrix.app.name }}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build debug APK
        if: steps.firebase.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/${{ matrix.app.slug }}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.firebase.outputs.skip != 'true'
        with:
          name: ${{ matrix.app.slug }}
          path: out/${{ matrix.app.slug }}.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Publish whatever built, even if one app failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apks/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No APKs were built."
            exit 1
          fi
          short="${GITHUB_SHA::7}"
          notes="Debug-signed APKs built from ${short}: $(basename -a "${files[@]}" | tr '\n' ' ')"
          gh release create "build-${GITHUB_RUN_NUMBER}" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${short})" \
            --notes "$notes" \
            --latest
